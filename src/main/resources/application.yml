spring:
  application:
    name: housebook
  datasource:
    url: jdbc:postgresql://${DB_HOST:100.99.6.52}:5432/${DB_NAME:housebook}
    username: ${DB_USER:sumin}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

app:
  # 로컬/상용 구분용. 상용 배포 시 APP_ENV=prod로 설정한다 (deploy/docker-compose.prod.yml 참고).
  env: ${APP_ENV:local}
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-key-change-in-production-please-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}
  # 비밀번호 재설정 메일에 넣는 링크의 기준 도메인.
  frontend-url: ${FRONTEND_URL:http://localhost:8081}
  molit:
    api-key: ${MOLIT_API_KEY:}
  kakao:
    api-key: ${KAKAO_API_KEY:}
  slack:
    # 비어있으면 알림을 보내지 않는다. 실제 웹훅 URL은 로컬 환경변수/deploy/.env에서만 채운다.
    error-webhook-url: ${SLACK_ERROR_WEBHOOK_URL:}

admin:
  username: ${ADMIN_USERNAME:admin}
  # 개발용 기본 비밀번호는 "AdminDev1234!" (BCrypt 해시). 운영 배포 시 반드시
  # ADMIN_USERNAME/ADMIN_PASSWORD_HASH 환경변수로 재설정할 것.
  password-hash: ${ADMIN_PASSWORD_HASH:$2a$10$2JCRJxJTshDMXxaiC2VSmOxRkUja13Wy/8P6VhRd1xlW1YSMuWiMS}
  # 이 이메일로 일반 로그인하면 그 계정도 관리자 화면에 들어갈 수 있다.
  user-email: ${ADMIN_USER_EMAIL:doslxk@gmail.com}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
