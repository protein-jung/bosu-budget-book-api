spring:
  application:
    name: housebook
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:housebook}
    username: ${DB_USER:sumin}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-only-secret-key-change-in-production-please-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006}
  molit:
    api-key: ${MOLIT_API_KEY:}
  kakao:
    api-key: ${KAKAO_API_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
